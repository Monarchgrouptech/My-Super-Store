<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="My Super Store product placeholder">
  <defs>
    <linearGradient id="mss-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121212"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="mss-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE55C"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#B8941F"/>
    </linearGradient>
    <radialGradient id="mss-glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#mss-bg)"/>
  <rect width="400" height="400" fill="url(#mss-glow)"/>

  <!-- subtle diamond grid accents -->
  <g stroke="#D4AF37" stroke-opacity="0.06" stroke-width="1" fill="none">
    <circle cx="200" cy="195" r="150"/>
    <circle cx="200" cy="195" r="165"/>
  </g>

  <!-- gem / diamond mark -->
  <g>
    <path d="M200 62 L305 195 L200 328 L95 195 Z" fill="none" stroke="url(#mss-gold)" stroke-width="3.5" stroke-linejoin="round" opacity="0.9"/>
    <path d="M200 112 L272 195 L200 278 L128 195 Z" fill="url(#mss-gold)" opacity="0.14"/>
    <path d="M95 195 L305 195" stroke="url(#mss-gold)" stroke-width="2.5" opacity="0.75"/>
    <path d="M200 62 L200 328" stroke="url(#mss-gold)" stroke-width="2.5" opacity="0.75"/>
    <path d="M200 62 L128 195 L200 328 L272 195 Z" fill="none" stroke="#FFE55C" stroke-width="1" opacity="0.5"/>
    <circle cx="200" cy="195" r="9" fill="url(#mss-gold)"/>
    <circle cx="200" cy="195" r="3.5" fill="#0A0A0A"/>
  </g>

  <!-- wordmark -->
  <text x="200" y="368" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" letter-spacing="4.5" fill="url(#mss-gold)">MY SUPER STORE</text>
  <text x="200" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="400" letter-spacing="5" fill="#8a8a8a">PREMIUM CURATED</text>
</svg>
